<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" type="image/ico" href="/src/assets/favicon.png" />
    <title>ZapThreads Sample App</title>
    <script src="./nostr-login.js" data-perms="sign_event:1985,sign_event:3,sign_event:30000" data-local-signup="false"></script>
    <script>
      document.addEventListener("nlAuth", async (e) => {
        console.log("nlAuth", e);

        if (e.detail.type === 'login' || e.detail.type === 'signup') {
          window.__nlAuthed = true;
        } else {
          window.__nlAuthed = false;
        }

        const pubkey = await window.nostr.getPublicKey();
        const zapThreads = document.querySelector('zap-threads');
        if (zapThreads) {
          if (window.__nlAuthed)
            zapThreads.setAttribute("user", pubkey);
          else
            zapThreads.setAttribute("user", "");
        }
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="./app/index.jsx" type="module"></script>
  </body>
</html>
